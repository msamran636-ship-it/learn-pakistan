<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn Pakistan Admin</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; margin: 0; padding: 0; }
    .admin-nav { background: #0b192c; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    .admin-nav h1 { margin: 0; font-size: 1.2rem; }
    .nav-actions { display: flex; gap: 0.5rem; }
    .btn-action { background: #34495e; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
    .btn-action:hover { background: #2c3e50; }
    .btn-logout { background: #e74c3c; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
    .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 2rem; }
    .hidden { display: none !important; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .btn-primary { background: #007bff; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    .article-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 0.8rem 0; }
    .article-item:last-child { border-bottom: none; }
    .preview-img { max-width: 100px; max-height: 60px; object-fit: cover; margin-top: 0.5rem; display: block; border-radius: 4px; }
  </style>
</head>
<body>

  <nav class="admin-nav">
    <h1>Learn Pakistan - Admin Dashboard</h1>
    <div id="navActions" class="nav-actions hidden">
      <button class="btn-action" onclick="updatePassword()">Change Password</button>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="container">
    <!-- Login View -->
    <div id="loginCard" class="card">
      <h2>Admin Login</h2>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" required value="admin">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required value="admin">
        </div>
        <button type="submit" class="btn-primary">Login</button>
      </form>
    </div>

    <!-- Main Dashboard View -->
    <div id="dashboard" class="card hidden">
      <h2>Create / Edit Article</h2>
      <form id="articleForm" onsubmit="saveArticle(event)">
        <input type="hidden" id="articleId">
        <input type="hidden" id="imageUrl">
        
        <div class="form-group">
          <label>English Title</label>
          <input type="text" id="title_en" required>
        </div>
        <div class="form-group">
          <label>Urdu Title</label>
          <input type="text" id="title_ur">
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="category" required>
            <option value="Knowledge">Knowledge</option>
            <option value="News">News</option>
            <option value="Technology">Technology</option>
            <option value="Education">Education</option>
          </select>
        </div>
        
        <!-- Image Upload Input -->
        <div class="form-group">
          <label>Featured Image</label>
          <input type="file" id="imageInput" accept="image/*" onchange="uploadImage(event)">
          <img id="imagePreview" class="preview-img hidden" src="" alt="Preview">
        </div>

        <div class="form-group">
          <label>English Content</label>
          <textarea id="content_en" rows="5" required></textarea>
        </div>
        <div class="form-group">
          <label>Urdu Content</label>
          <textarea id="content_ur" rows="5"></textarea>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="status">
            <option value="published">Published</option>
            <option value="draft">Draft</option>
          </select>
        </div>
        <button type="submit" class="btn-primary">Save Article</button>
      </form>

      <hr style="margin: 2rem 0;">

      <h2>Manage Articles</h2>
      <div id="articlesList">Loading articles...</div>
    </div>
  </div>

  <script>
    async function checkAuth() {
      try {
        const res = await fetch("/api/me");
        if (res.ok) {
          showDashboard();
        } else {
          showLogin();
        }
      } catch {
        showLogin();
      }
    }

    function showLogin() {
      document.getElementById("loginCard").classList.remove("hidden");
      document.getElementById("dashboard").classList.add("hidden");
      document.getElementById("navActions").classList.add("hidden");
    }

    function showDashboard() {
      document.getElementById("loginCard").classList.add("hidden");
      document.getElementById("dashboard").classList.remove("hidden");
      document.getElementById("navActions").classList.remove("hidden");
      loadArticles();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById("username").value;
      const p = document.getElementById("password").value;

      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: u, password: p })
      });

      if (res.ok) {
        showDashboard();
      } else {
        alert("Invalid login credentials.");
      }
    }

    async function updatePassword() {
      const newPass = prompt("Enter your new admin password:");
      if (!newPass) return;
      if (newPass.length < 4) {
        alert("Password must be at least 4 characters long.");
        return;
      }
      
      const res = await fetch("/api/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ newPassword: newPass })
      });

      if (res.ok) {
        alert("Password updated successfully! Use your new password on your next login.");
      } else {
        alert("Failed to update password.");
      }
    }

    async function uploadImage(e) {
      const file = e.target.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append("image", file);

      const res = await fetch("/api/upload", {
        method: "POST",
        body: formData
      });

      if (res.ok) {
        const data = await res.json();
        document.getElementById("imageUrl").value = data.url;
        
        const preview = document.getElementById("imagePreview");
        preview.src = data.url;
        preview.classList.remove("hidden");
      } else {
        alert("Failed to upload image.");
      }
    }

    async function logout() {
      await fetch("/api/logout", { method: "POST" });
      showLogin();
    }

    async function loadArticles() {
      const res = await fetch("/api/articles?status=");
      const data = await res.json();
      const list = document.getElementById("articlesList");
      if (!data.length) {
        list.innerHTML = "<p>No articles found.</p>";
        return;
      }
      list.innerHTML = data.map(a => `
        <div class="article-item">
          <div>
            <strong>${a.title_en}</strong> (${a.category}) - <em>${a.status}</em>
            ${a.image_url ? `<br><img src="${a.image_url}" class="preview-img">` : ''}
          </div>
          <div>
            <button onclick="editArticle(${a.id})" style="padding: 0.3rem 0.6rem; margin-right: 0.3rem;">Edit</button>
            <button onclick="deleteArticle(${a.id})" style="background: #dc3545; color: white; border: none; padding: 0.3rem 0.6rem; border-radius: 3px; cursor: pointer;">Delete</button>
          </div>
        </div>
      `).join("");
    }

    async function saveArticle(e) {
      e.preventDefault();
      const id = document.getElementById("articleId").value;
      const payload = {
        title_en: document.getElementById("title_en").value,
        title_ur: document.getElementById("title_ur").value,
        category: document.getElementById("category").value,
        content_en: document.getElementById("content_en").value,
        content_ur: document.getElementById("content_ur").value,
        status: document.getElementById("status").value,
        image_url: document.getElementById("imageUrl").value
      };

      const method = id ? "PUT" : "POST";
      const url = id ? `/api/articles/${id}` : `/api/articles`;

      const res = await fetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        document.getElementById("articleForm").reset();
        document.getElementById("articleId").value = "";
        document.getElementById("imageUrl").value = "";
        document.getElementById("imagePreview").classList.add("hidden");
        loadArticles();
      } else {
        alert("Error saving article.");
      }
    }

    async function deleteArticle(id) {
      if (!confirm("Are you sure you want to delete this article?")) return;
      await fetch(`/api/articles/${id}`, { method: "DELETE" });
      loadArticles();
    }

    checkAuth();
  </script>
</body>
</html>
